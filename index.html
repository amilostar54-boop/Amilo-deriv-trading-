<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMILO - Live Deriv Trading Kericho Kenya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:white}
.header{background:#ff444f;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:32px;letter-spacing:2px}
.header p{opacity:0.9;margin-top:4px}
.ticker{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#1e1e1e;border-radius:16px;padding:14px;text-align:center;border:1px solid #333}
.card h3{font-size:12px;color:#888;margin-bottom:6px}
.price{font-size:22px;font-weight:bold;color:#00ff88}
.change{font-size:12px;margin-top:4px}
.btn{background:#ff444f;color:white;border:none;padding:14px 20px;border-radius:30px;font-weight:bold;width:100%;margin-top:10px;font-size:15px}
.btn-green{background:#00c853}
.markets{padding:12px}
.chart-box{background:#1e1e1e;border-radius:16px;overflow:hidden;margin-top:12px;border:1px solid #333;height:420px}
.footer{text-align:center;padding:20px;color:#666;font-size:12px}
.live-dot{display:inline-block;width:8px;height:8px;background:#00ff88;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div class="header">
<h1>AMILO</h1>
<p><span class="live-dot"></span> LIVE Deriv • Kericho, Kenya</p>
</div>

<div class="ticker">
<div class="card"><h3>VOLATILITY 75</h3><div class="price" id="v75">---</div><div class="change" id="c75">Connecting...</div></div>
<div class="card"><h3>VOLATILITY 100</h3><div class="price" id="v100">---</div><div class="change" id="c100">Connecting...</div></div>
<div class="card"><h3>BOOM 1000</h3><div class="price" id="b1000">---</div><div class="change" id="cb1000">Connecting...</div></div>
<div class="card"><h3>CRASH 1000</h3><div class="price" id="c1000">---</div><div class="change" id="cc1000">Connecting...</div></div>
</div>

<div class="markets">
<button class="btn" onclick="window.open('https://track.deriv.com/_6TgWQ7d0pV0YV2o5Jv8zGNd7ZgqdRLk/1/','_blank')">🚀 Open Real Deriv Account (Earn Commission)</button>
<button class="btn btn-green" style="margin-top:8px" onclick="window.open('https://wa.me/254700000000?text=Hello%20Amilo%20I%20want%20to%20learn%20Deriv','_blank')">💬 WhatsApp - Kericho Trading Class</button>
<div class="chart-box">
<iframe src="https://tradingview.deriv.com/deriv?market=synthetic_indices&symbol=R_75" style="width:100%;height:100%;border:none"></iframe>
</div>
<div class="chart-box" style="height:420px;margin-top:10px">
<iframe src="https://tradingview.deriv.com/deriv?market=synthetic_indices&symbol=R_100" style="width:100%;height:100%;border:none"></iframe>
</div>
</div>

<div class="footer">© 2026 AMILO Trading - Kericho | Live prices from Deriv.com API</div>

<script>
const symbols = {
'R_75':'v75','R_100':'v100','BOOM_1000':'b1000','CRASH_1000':'c1000'
};
const changes = {'R_75':'c75','R_100':'c100','BOOM_1000':'cb1000','CRASH_1000':'cc1000'};
let ws;
function connect(){
ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
ws.onopen = function(){
console.log('Connected');
Object.keys(symbols).forEach(s=>{ws.send(JSON.stringify({ticks:s}))});
};
ws.onmessage = function(msg){
let data = JSON.parse(msg.data);
if(data.tick){
let id = symbols[data.tick.symbol];
let cid = changes[data.tick.symbol];
if(id){
document.getElementById(id).innerText = parseFloat(data.tick.quote).toFixed(2);
document.getElementById(cid).innerText = '● LIVE '+new Date().toLocaleTimeString();
document.getElementById(cid).style.color='#00ff88';
}
}
};
ws.onclose = function(){setTimeout(connect,3000)};
ws.onerror = function(){ws.close()};
}
connect();
</script>
</body>
</html>
