<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMILO LIVE MARKET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e12;color:#fff;font-family:sans-serif}
.h{background:#ff444f;padding:20px;text-align:center}
.c{background:#151a21;margin:15px;padding:24px;border-radius:18px;text-align:center;border:1px solid #222}
.p{font-size:52px;font-weight:900}
.up{color:#00ff88}.down{color:#ff444f}
.b{background:#ff444f;color:#fff;padding:16px;width:100%;border:none;border-radius:12px;font-weight:800;margin-top:15px}
.ch{height:460px;margin:15px;background:#111;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<div class="h"><h1>AMILO</h1><p>🔴 LIVE Deriv - Kericho Kenya</p></div>
<div class="c">
<div style="font-size:11px;color:#666">VOLATILITY 100 INDEX - LIVE TICK</div>
<div class="p up" id="pr">...</div>
<div id="di" style="margin-top:6px;color:#aaa">Connecting to Deriv...</div>
<div id="st" style="margin-top:10px;color:#00ff88;font-size:12px">● Connecting...</div>
<a href="https://track.deriv.com/_84M2bJ7Wv0U2q2Oe0fMUN2Nd7ZgqdRLk/1/" target="_blank"><button class="b">🚀 Open Real Account</button></a>
</div>
<div class="ch"><iframe src="https://tradingview.deriv.com/deriv?market=synthetic_indices&symbol=R_100" style="width:100%;height:100%;border:none"></iframe></div>
<script>
let L=0;
function C(){
let w=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
w.onopen=()=>{w.send(JSON.stringify({ticks:'R_100'}));document.getElementById('st').innerText='● LIVE CONNECTED';}
w.onmessage=(e)=>{let j=JSON.parse(e.data);if(j.tick){let q=parseFloat(j.tick.quote);document.getElementById('pr').innerText=q.toFixed(2);document.getElementById('pr').className='p '+(q>L?'up':'down');document.getElementById('di').innerText=(q>L?'▲ +':'▼ ')+(q-L).toFixed(2)+' • '+new Date().toLocaleTimeString();L=q;}};
w.onclose=()=>{document.getElementById('st').innerText='● Reconnecting...';setTimeout(C,2000);}
}
C();
</script>
</body>
</html>
